plugins {
    id 'com.android.application'
}

def aneConfig = rootProject.ext.aneConfig
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
def hasReleaseSigning = keystorePropertiesFile.exists()

if (hasReleaseSigning) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace 'com.ane.filemanager'
    compileSdk aneConfig.compileSdk
    ndkVersion aneConfig.ndkVersion

    defaultConfig {
        applicationId aneConfig.applicationId
        minSdk aneConfig.minSdk
        targetSdk aneConfig.targetSdk
        versionCode aneConfig.versionCode
        versionName aneConfig.versionName
        ndk {
            abiFilters(*aneConfig.supportedAbis)
        }
    }

    externalNativeBuild {
        ndkBuild {
            path 'src/main/cpp/Android.mk'
        }
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword rootProject.file(keystoreProperties['storePasswordFile'])
                    .getText('UTF-8').trim()
                keyAlias keystoreProperties['keyAlias']
                keyPassword rootProject.file(keystoreProperties['keyPasswordFile'])
                    .getText('UTF-8').trim()
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.beta'
            versionNameSuffix '-beta'
        }
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    // Each plugin owns its Android values beside its implementation. They are merged only at build time.
    sourceSets {
        main.res.srcDirs += [
            'src/main/java/com/ane/filemanager/plugin/archive/res',
            'src/main/java/com/ane/filemanager/plugin/audio/res',
            'src/main/java/com/ane/filemanager/plugin/image/res',
            'src/main/java/com/ane/filemanager/plugin/text/res',
            'src/main/java/com/ane/filemanager/plugin/terminal/res',
            'src/main/java/com/ane/filemanager/plugin/video/res',
            'src/main/java/com/ane/filemanager/pluginmanager/res'
        ]
        main.assets.srcDirs += [
            'src/main/java/com/ane/filemanager/plugin/archive/assets',
            'src/main/java/com/ane/filemanager/plugin/audio/assets',
            'src/main/java/com/ane/filemanager/plugin/image/assets',
            'src/main/java/com/ane/filemanager/plugin/text/assets',
            'src/main/java/com/ane/filemanager/plugin/video/assets',
            'src/main/java/com/ane/filemanager/plugin/terminal/assets'
        ]
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility aneConfig.javaVersion
        targetCompatibility aneConfig.javaVersion
    }
}

dependencies {
    implementation project(':plugin-api')
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    implementation 'org.apache.commons:commons-compress:1.28.0'
    implementation 'org.tukaani:xz:1.10'
    implementation 'net.lingala.zip4j:zip4j:2.11.6'
    implementation 'com.github.junrar:junrar:8.1.0'
    runtimeOnly 'org.slf4j:slf4j-nop:2.0.17'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    testImplementation 'junit:junit:4.13.2'
}
